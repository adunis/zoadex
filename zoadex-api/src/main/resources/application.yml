spring:
  application:
    name: zoadex-api

  datasource:
    url: jdbc:postgresql://localhost:5432/zoadex
    username: zoadex
    password: zoadex
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Mail Configuration (configure with your SMTP provider)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true

server:
  port: 8080

# JWT Configuration
zoadex:
  jwt:
    secret: CHANGE_ME_IN_PRODUCTION_USE_A_256_BIT_SECRET_KEY_HERE_PLACEHOLDER
    expiration-ms: 86400000

  # Mail settings
  mail:
    from: ${MAIL_FROM:noreply@zoadex.app}
    base-url: ${APP_BASE_URL:http://localhost:5173}

  # Stripe Configuration (3 EUR/month premium subscription with 10 region slots)
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    price-id: ${STRIPE_PRICE_ID:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

  # External API Configuration
  gbif:
    base-url: https://api.gbif.org/v1

  wikimedia:
    base-url: https://en.wikipedia.org/w/api.php

  inaturalist:
    base-url: https://api.inaturalist.org/v1

  # CORS
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
